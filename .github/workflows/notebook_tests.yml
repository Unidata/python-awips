name: Test example notebooks

on:
  workflow_dispatch:

  schedule:
    # Run nightly at 4:30 AM Mountain Time
    - cron: "30 4 * * *"
      timezone: "America/Denver"

jobs:
  test-notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create python-awips environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install python-awips
        shell: micromamba-shell {0}
        run: python -m pip install .

      - name: Execute example notebooks
        shell: micromamba-shell {0}
        run: |
          pytest \
            --nbmake examples/notebooks/*.ipynb \
            --ignore=examples/notebooks/GOES_CIRA_Product_Writer.ipynb \
            --nbmake-timeout=600
